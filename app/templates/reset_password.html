<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Restablecer contraseña</title>

<link rel="stylesheet" href="/static/css/auth.css">

</head>
<body>

<div id="tsparticles"></div>

<div class="center-screen">

    <div class="glass-card">

        <h2>Restablecer contraseña</h2>
        <p class="subtitle">Ingresa tu nueva contraseña</p>

        <form id="resetForm">

            <input type="hidden" id="token" value="{{ token }}">

            <input
                type="password"
                id="new_password"
                class="auth-input"
                placeholder="Nueva contraseña"
                required
            >

            <input
                type="password"
                id="confirm_password"
                class="auth-input"
                placeholder="Confirmar contraseña"
                required
            >

            <button type="submit" class="btn-auth">
                Actualizar contraseña
            </button>

        </form>

        <div id="msg" class="mt-3"></div>

        <div class="back-container">
            <a href="/" class="back-login">Volver al login</a>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

<script>
tsParticles.load("tsparticles", {
    background: { color: "#020617" },
    particles: {
        number: { value: 70 },
        color: { value: "#6366f1" },
        links: {
            enable: true,
            distance: 140,
            opacity: 0.15
        },
        move: { enable: true, speed: 1.2 },
        opacity: { value: 0.4 },
        size: { value: { min: 1, max: 3 } }
    }
});

document.getElementById("resetForm").addEventListener("submit", async (e) => {

    e.preventDefault();

    const token = document.getElementById("token").value;
    const new_password = document.getElementById("new_password").value;
    const confirm_password = document.getElementById("confirm_password").value;
    const msg = document.getElementById("msg");

    msg.innerHTML = "";

    if (new_password !== confirm_password) {
        msg.innerHTML = "<span class='error'>Las contraseñas no coinciden</span>";
        return;
    }

    try {

        const response = await fetch("/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                token: token,
                new_password: new_password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Error");
        }

        msg.innerHTML = "<span class='success'>Contraseña actualizada. Redirigiendo...</span>";

        setTimeout(() => {
            window.location.href = "/";
        }, 2000);

    } catch (error) {
        msg.innerHTML = "<span class='error'>" + error.message + "</span>";
    }

});
</script>

</body>
</html>
