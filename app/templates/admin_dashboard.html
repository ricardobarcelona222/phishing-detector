<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/admin_dashboard.css">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2> Panel Administrador</h2>

<div class="kpi-container">
    <div class="kpi-card">
        <h6>Total Analizados</h6>
        <p id="kpiTotal">0</p>
    </div>

    <div class="kpi-card">
        <h6>Phishing</h6>
        <p id="kpiPhishing">0</p>
    </div>

    <div class="kpi-card">
        <h6>Legítimos</h6>
        <p id="kpiSafe">0</p>
    </div>
</div>

<button class="btn btn-danger mb-3" onclick="logout()">Cerrar sesión</button>
<button onclick="toggleDarkMode()" class="btn btn-secondary mb-3 ms-2">
Modo oscuro
</button>

<!-- ESTADISTICAS -->
<div class="card mb-4 fade-scroll">
<div class="card-header"> Estadísticas Globales</div>
<div class="card-body">
<canvas id="adminStatsChart"></canvas>
</div>
</div>

<!-- 🔥 NUEVO: USUARIOS PENDIENTES -->
<div class="card mb-4 fade-scroll">
<div class="card-header">⏳ Usuarios Pendientes de Aprobación</div>
<div class="card-body">
<table class="table table-striped">
<thead>
<tr>
<th>ID</th>
<th>Email</th>
<th>Proveedor</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="pendingUsersTable"></tbody>
</table>
</div>
</div>

<!-- USUARIOS -->
<div class="card mb-4 fade-scroll">
<div class="card-header">👤 Usuarios</div>
<div class="card-body">
<table class="table table-striped">
<thead>
<tr>
<th>ID</th>
<th>Email</th>
<th>Rol</th>
<th>Aprobado</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="usersTable"></tbody>
</table>
</div>
</div>

<!-- ANALISIS GLOBAL -->
<div class="card">
<div class="card-header"> Historial Global</div>
<div class="card-body">
<table class="table table-hover">
<thead>
<tr>
<th>ID</th>
<th>Mensaje</th>
<th>Phishing</th>
<th>Fecha</th>
</tr>
</thead>
<tbody id="analysisTable"></tbody>
</table>
</div>
</div>

</div>

<script src="/static/js/admin_dashboard.js"></script>
<script src="/static/js/admin_ui.js"></script>

</body>
</html>
