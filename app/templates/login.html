<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Phishing Detector</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/auth.css">

<!-- PARTICLES LIB -->
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

</head>

<body>

<!-- PARTICLES BACKGROUND -->
<div id="tsparticles"></div>

<div class="login-wrapper">

<!-- LEFT PANEL -->
<div class="premium-left">

<div class="floating-card card1"></div>
<div class="floating-card card2"></div>

<div class="left-content">
<h1>Phishing Detector</h1>
<p>
Protección inteligente contra ataques phishing usando análisis automatizado y machine learning.
</p>
</div>

</div>

<!-- RIGHT PANEL -->
<div class="premium-right">

<div class="premium-card">

<h3>Bienvenido</h3>
<p class="subtitle">Accede a tu cuenta</p>

<a href="/auth/google/login" class="google-btn">
<img src="https://developers.google.com/identity/images/g-logo.png">
Continuar con Google
</a>

<div class="divider">
<span>o continuar con email</span>
</div>

<form id="loginForm">

<div class="input-group-custom">
<input type="email" id="email" required>
<label>Email</label>
</div>

<div class="input-group-custom password-group">
<input type="password" id="password" required>
<label>Password</label>
<span class="toggle-pass" onclick="togglePassword()">👁</span>
</div>

<button class="btn-premium w-100" type="submit">
Iniciar sesión
</button>

<div id="loader" class="loader hidden"></div>

</form>

<div id="error" class="error-text"></div>

<div class="auth-links">
<a href="/forgot-password">¿Olvidaste tu contraseña?</a>
<a href="/register">Crear cuenta</a>
</div>

</div>
</div>
</div>

<script src="/static/js/login.js"></script>

<script>
function togglePassword(){
const pass = document.getElementById("password");
pass.type = pass.type === "password" ? "text" : "password";
}
</script>

<!-- PARTICLES CONFIG -->
<script>
tsParticles.load("tsparticles", {
    background: {
        color: "#020617"
    },

    fpsLimit: 60,

    interactivity: {
        events: {
            onHover: { enable: true, mode: "repulse" },
            onClick: { enable: true, mode: "push" }
        },
        modes: {
            repulse: { distance: 120 },
            push: { quantity: 4 }
        }
    },

    particles: {
        number: { value: 70 },

        color: { value: "#6366f1" },

        links: {
            enable: true,
            distance: 140,
            opacity: 0.15
        },

        move: {
            enable: true,
            speed: 1.2,
            outModes: { default: "bounce" }
        },

        opacity: { value: 0.4 },

        size: { value: { min: 1, max: 3 } }
    }
});
</script>
<script>
/* Mostrar mensaje si viene error desde Google */
const params = new URLSearchParams(window.location.search);
const errorParam = params.get("error");

if (errorParam === "pending") {
    document.getElementById("error").innerText =
        "Tu cuenta está pendiente de aprobación por el administrador.";
}
</script>

</body>
</html>
