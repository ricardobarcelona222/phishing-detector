<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recuperar contraseña</title>

<link rel="stylesheet" href="/static/css/auth.css">
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
</head>

<body>

<div id="tsparticles"></div>

<script>
tsParticles.load("tsparticles", {
    background: { color: "#020617" },
    fpsLimit: 60,
    interactivity: {
        events: {
            onHover: { enable: true, mode: "repulse" },
            onClick: { enable: true, mode: "push" }
        },
        modes: {
            repulse: { distance: 120 },
            push: { quantity: 4 }
        }
    },
    particles: {
        number: { value: 70 },
        color: { value: "#6366f1" },
        links: {
            enable: true,
            distance: 140,
            opacity: 0.15
        },
        move: {
            enable: true,
            speed: 1.2,
            outModes: { default: "bounce" }
        },
        opacity: { value: 0.4 },
        size: { value: { min: 1, max: 3 } }
    }
});
</script>

<div class="center-screen">
<div class="glass-card register-card">

<h2 class="auth-title">Recuperar contraseña</h2>

<form id="forgotForm" class="auth-form-center">

<input 
    type="email" 
    id="email"
    class="form-control auth-input"
    placeholder="Ingresa tu email"
    required
>

<button class="btn-auth">Enviar enlace</button>

</form>

<div id="msg" class="auth-msg"></div>

<div class="back-container">
<a href="/" class="back-login">← Volver al login</a>
</div>

</div>
</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;

    try {
        const response = await fetch("/forgot-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Error");
        }

        document.getElementById("msg").innerHTML =
            "<span style='color: #22c55e'>Si el correo existe, recibirás un enlace.</span>";

    } catch (error) {
        document.getElementById("msg").innerHTML =
            "<span style='color: #ef4444'>" + error.message + "</span>";
    }
});
</script>

</body>
</html>
